<style>
/* =========================================================
   FileFlow — Design tokens
   ========================================================= */
:root{
  --navy:#142B45; --blue:#2878D0; --sky:#55B5F5; --white:#FFFFFF; --mist:#F4F7FB; --slate:#718096;
  --success:#1E9E6A; --warning:#E08A1E; --danger:#D64545;

  --bg:#F4F7FB; --surface:#FFFFFF; --surface-2:#F8FAFD; --surface-3:#EEF3F9;
  --border:#E3E9F2; --border-strong:#C9D5E4;
  --text:#142B45; --text-2:#718096; --text-3:#9AA8BA;
  --primary:#2878D0; --primary-hover:#1F66B6; --primary-soft:rgba(40,120,208,.08); --primary-soft-2:rgba(40,120,208,.14);
  --accent:#55B5F5;
  --success-soft:rgba(30,158,106,.10); --warning-soft:rgba(224,138,30,.12); --danger-soft:rgba(214,69,69,.10);
  --shadow-sm:0 1px 2px rgba(20,43,69,.05);
  --shadow:0 1px 2px rgba(20,43,69,.04), 0 6px 18px -6px rgba(20,43,69,.10);
  --shadow-lg:0 2px 4px rgba(20,43,69,.04), 0 18px 44px -12px rgba(20,43,69,.20);
  --ring:0 0 0 4px rgba(40,120,208,.18);
  --header-bg:rgba(255,255,255,.82);
  --lm-doc:#142B45; --lm-fold:#2878D0; --lm-back:#55B5F5; --lm-f1:#55B5F5; --lm-f2:#FFFFFF;
  --radius:16px; --radius-sm:12px; --radius-lg:22px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Manrope','Inter',system-ui,sans-serif;
}
[data-theme="dark"]{
  --bg:#0B1624; --surface:#102033; --surface-2:#13263C; --surface-3:#183049;
  --border:#1F3753; --border-strong:#2B4A6C;
  --text:#E7EEF7; --text-2:#93A6BE; --text-3:#6D829C;
  --primary:#3D8DE4; --primary-hover:#5AA0EC; --primary-soft:rgba(85,181,245,.10); --primary-soft-2:rgba(85,181,245,.18);
  --success-soft:rgba(30,158,106,.16); --warning-soft:rgba(224,138,30,.16); --danger-soft:rgba(214,69,69,.16);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 1px 2px rgba(0,0,0,.25), 0 8px 22px -8px rgba(0,0,0,.45);
  --shadow-lg:0 2px 4px rgba(0,0,0,.25), 0 22px 50px -14px rgba(0,0,0,.6);
  --ring:0 0 0 4px rgba(85,181,245,.22);
  --header-bg:rgba(11,22,36,.78);
  --lm-doc:#2878D0; --lm-fold:#55B5F5; --lm-back:#55B5F5; --lm-f1:#FFFFFF; --lm-f2:#BFE3FB;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background .3s var(--ease),color .3s var(--ease)}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-.02em;color:var(--text)}
p{margin:0}
button,input,select{font:inherit;color:inherit}
a{color:var(--primary);text-decoration:none}
svg{display:block}
.container{max-width:1180px;margin:0 auto;padding:0 28px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:10px}
.reduce-motion *,.reduce-motion *::before,.reduce-motion *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- Logo ---------- */
.lm-doc{fill:var(--lm-doc)} .lm-fold{fill:var(--lm-fold)} .lm-back{fill:var(--lm-back);opacity:.38}
.lm-f1{stroke:var(--lm-f1)} .lm-f2{stroke:var(--lm-f2)} .lm-dot{fill:var(--lm-f1)}
.logo{display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none;background:none;border:0;padding:4px;border-radius:12px}
.logo-mark{width:36px;height:36px;flex:none;transition:transform .4s var(--ease)}
.logo:hover .logo-mark{transform:rotate(-6deg) scale(1.04)}
.logo-text{display:flex;flex-direction:column;line-height:1;text-align:left}
.wordmark{font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:-.035em;color:var(--text)}
.wordmark b{color:var(--primary);font-weight:800}
.tagline{font-size:8.6px;font-weight:600;letter-spacing:.17em;text-transform:uppercase;color:var(--text-2);margin-top:5px}

/* ---------- Header ---------- */
.header{position:sticky;top:0;z-index:40;background:var(--header-bg);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--border)}
.header-in{display:flex;align-items:center;gap:22px;height:72px}
.nav{display:flex;gap:4px;margin-left:18px}
.nav a{padding:8px 14px;border-radius:10px;color:var(--text-2);font-weight:500;font-size:14px;transition:color .2s,background .2s}
.nav a:hover{color:var(--text);background:var(--surface-3)}
.nav a.active{color:var(--primary);background:var(--primary-soft)}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.platform-pill{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--text-2);padding:6px 12px;border:1px solid var(--border);border-radius:999px;background:var(--surface)}
.platform-pill i{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px var(--success-soft)}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:11px;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--text-2);transition:all .2s var(--ease)}
.icon-btn:hover{color:var(--text);border-color:var(--border-strong);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.95)}
.icon-btn svg{width:19px;height:19px}
.theme-btn .moon{display:none}
[data-theme="dark"] .theme-btn .sun{display:none}
[data-theme="dark"] .theme-btn .moon{display:block}
.menu-btn{display:none}
@media (max-width:900px){.platform-pill{display:none}}
@media (max-width:760px){
  .nav{position:absolute;top:72px;left:0;right:0;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px 16px;margin:0;display:none;box-shadow:var(--shadow)}
  .nav.open{display:flex}
  .menu-btn{display:grid}
  .container{padding:0 18px}
}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:46px;padding:0 22px;border-radius:12px;border:1px solid transparent;font-weight:600;font-size:14.5px;cursor:pointer;transition:background .2s var(--ease),transform .15s var(--ease),box-shadow .2s var(--ease),border-color .2s;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 1px 2px rgba(20,43,69,.15),0 8px 20px -8px rgba(40,120,208,.55)}
.btn-primary:hover{background:var(--primary-hover);box-shadow:0 1px 2px rgba(20,43,69,.15),0 12px 26px -8px rgba(40,120,208,.6);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-secondary{background:var(--surface);border-color:var(--border);color:var(--text)}
.btn-secondary:hover{border-color:var(--border-strong);background:var(--surface-2)}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn-ghost:hover{color:var(--text);background:var(--surface-3)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{filter:brightness(.95)}
.btn-lg{height:52px;padding:0 28px;font-size:15.5px;border-radius:14px}
.btn-sm{height:36px;padding:0 14px;font-size:13px;border-radius:10px}

/* ---------- Hero ---------- */
.hero{padding:70px 0 40px}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);background:var(--primary-soft);padding:7px 13px;border-radius:999px}
.eyebrow svg{width:14px;height:14px}
.hero h1{font-size:clamp(34px,4.6vw,54px);line-height:1.06;font-weight:800;margin:20px 0 18px;letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:var(--primary)}
.hero .sub{font-size:17.5px;color:var(--text-2);max-width:520px;line-height:1.6}
.hero-actions{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.trust{display:flex;gap:22px;margin-top:34px;flex-wrap:wrap}
.trust div{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text-2);font-weight:500}
.trust svg{width:17px;height:17px;color:var(--success)}
.hero-art{position:relative}
.hero-art svg{width:100%;height:auto}
.ha-card{fill:var(--surface);stroke:var(--border)}
.ha-line{fill:var(--surface-3)}
.ha-flow{fill:none;stroke:var(--primary);stroke-width:2;stroke-linecap:round;stroke-dasharray:3 7;animation:flow 1.6s linear infinite;opacity:.75}
.ha-flow-base{fill:none;stroke:var(--primary-soft-2);stroke-width:6;stroke-linecap:round}
.ha-node{fill:var(--surface);stroke:var(--border)}
.ha-ring{fill:none;stroke:var(--primary);stroke-opacity:.18;stroke-width:1.5;transform-origin:230px 180px;animation:pulse 3s var(--ease) infinite}
.ha-badge{font:700 10px var(--font);letter-spacing:.06em}
.ha-glow{fill:var(--primary);opacity:.06}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes pulse{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.35);opacity:0}}
.float{animation:float 6s ease-in-out infinite}
.float.d2{animation-delay:-2s}.float.d3{animation-delay:-4s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}.hero-art{max-width:460px;margin:0 auto}.hero{padding-top:44px}}

/* ---------- Search ---------- */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:40px 0 8px;flex-wrap:wrap}
.toolbar h2{font-size:26px;font-weight:800}
.toolbar p{color:var(--text-2);margin-top:4px}
.search{position:relative;width:min(340px,100%)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text-3)}
.search input{width:100%;height:46px;border-radius:12px;border:1px solid var(--border);background:var(--surface);padding:0 14px 0 42px;transition:border-color .2s,box-shadow .2s}
.search input:focus{outline:none;border-color:var(--primary);box-shadow:var(--ring)}
.search input::placeholder{color:var(--text-3)}

/* ---------- Tool cards ---------- */
.cat{margin-top:34px}
.cat-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.cat-head .cat-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);color:var(--primary)}
.cat-head .cat-ic svg{width:16px;height:16px}
.cat-head h3{font-size:16.5px;font-weight:700}
.cat-head span{font-size:12.5px;color:var(--text-2);background:var(--surface-3);padding:2px 9px;border-radius:999px;font-weight:600}
.cat-head .rule{flex:1;height:1px;background:var(--border)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:16px}
.tool-card{position:relative;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 22px 20px;cursor:pointer;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-sm);transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s}
.tool-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--primary) 35%,var(--border))}
.tool-card:active{transform:translateY(-1px)}
.tool-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);transition:background .25s,color .25s,transform .35s var(--ease)}
.tool-ic svg{width:25px;height:25px}
.tool-card:hover .tool-ic{background:var(--primary);color:#fff;transform:rotate(-4deg)}
.tool-card[data-cat="org"] .tool-ic{background:rgba(20,43,69,.06);color:var(--navy)}
[data-theme="dark"] .tool-card[data-cat="org"] .tool-ic{background:rgba(231,238,247,.07);color:#CFE0F3}
.tool-card[data-cat="org"]:hover .tool-ic{background:var(--navy);color:#fff}
[data-theme="dark"] .tool-card[data-cat="org"]:hover .tool-ic{background:#E7EEF7;color:var(--navy)}
.tool-card[data-cat="img"] .tool-ic{background:rgba(85,181,245,.13);color:#1E8BD3}
.tool-card[data-cat="img"]:hover .tool-ic{background:var(--accent);color:#fff}
.tool-card h4{font-size:16.5px;font-weight:700}
.tool-card p{font-size:13.8px;color:var(--text-2);line-height:1.55;flex:1}
.tool-foot{display:flex;align-items:center;justify-content:space-between}
.fmt{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--text-2)}
.fmt span{padding:3px 8px;border-radius:6px;background:var(--surface-3)}
.fmt svg{width:12px;height:12px;color:var(--text-3)}
.go{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--primary);opacity:0;transform:translateX(-6px);transition:all .25s var(--ease)}
.go svg{width:17px;height:17px}
.tool-card:hover .go{opacity:1;transform:none}
.empty-search{padding:50px;text-align:center;color:var(--text-2);border:1px dashed var(--border-strong);border-radius:var(--radius);margin-top:30px}

/* ---------- Sections ---------- */
.section{padding:70px 0 10px}
.section-head{text-align:center;max-width:620px;margin:0 auto 38px}
.section-head h2{font-size:30px;font-weight:800}
.section-head p{color:var(--text-2);margin-top:10px;font-size:16px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.step{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:26px;position:relative}
.step .n{font-family:var(--font-display);font-weight:800;font-size:13px;color:var(--primary);background:var(--primary-soft);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:16px}
.step h4{font-size:16.5px;margin-bottom:6px}
.step p{color:var(--text-2);font-size:14px}
.privacy{margin-top:18px;display:flex;align-items:center;gap:22px;padding:26px 30px;border-radius:var(--radius-lg);background:var(--navy);color:#fff;position:relative;overflow:hidden}
.privacy::after{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;border:40px solid rgba(85,181,245,.08)}
.privacy .pic{width:52px;height:52px;border-radius:14px;background:rgba(85,181,245,.15);display:grid;place-items:center;color:var(--sky);flex:none}
.privacy .pic svg{width:26px;height:26px}
.privacy h4{color:#fff;font-size:17px}
.privacy p{color:#B5C6DA;font-size:14px;margin-top:3px;max-width:680px}
[data-theme="dark"] .privacy{background:linear-gradient(0deg,var(--surface-2),var(--surface-2));border:1px solid var(--border)}
@media (max-width:760px){.steps{grid-template-columns:1fr}.privacy{flex-direction:column;align-items:flex-start}}

/* ---------- Footer ---------- */
.footer{margin-top:80px;border-top:1px solid var(--border);background:var(--surface)}
.footer-in{display:flex;justify-content:space-between;gap:30px;padding:36px 0;flex-wrap:wrap;align-items:center}
.footer p{color:var(--text-2);font-size:13.5px}
.slogan{font-family:var(--font-display);font-weight:700;color:var(--text);font-size:14px;letter-spacing:-.01em}
.slogan i{font-style:normal;color:var(--primary)}

/* ---------- Tool view ---------- */
.view{animation:viewIn .45s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.crumbs{display:flex;align-items:center;gap:8px;margin:30px 0 22px;font-size:13.5px;color:var(--text-2)}
.crumbs button{background:none;border:0;cursor:pointer;color:var(--text-2);display:inline-flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;border-radius:9px;font-weight:500}
.crumbs button:hover{color:var(--text);background:var(--surface-3)}
.crumbs svg{width:16px;height:16px}
.crumbs .sep{color:var(--text-3)}
.tool-hero{display:flex;align-items:center;gap:18px;margin-bottom:26px}
.tool-hero .tool-ic{width:58px;height:58px;border-radius:16px;background:var(--primary);color:#fff;box-shadow:0 10px 24px -10px rgba(40,120,208,.7)}
.tool-hero .tool-ic svg{width:29px;height:29px}
.tool-hero h1{font-size:30px;font-weight:800}
.tool-hero p{color:var(--text-2);margin-top:4px}
.stage{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:30px;min-height:360px}
.related{margin-top:34px}
.related h3{font-size:15px;color:var(--text-2);font-weight:600;margin-bottom:14px}
.related .grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.related .tool-card{padding:16px;flex-direction:row;align-items:center;gap:12px}
.related .tool-card p{display:none}
.related .tool-card .tool-foot{display:none}
.related .tool-ic{width:40px;height:40px;border-radius:12px}
.related .tool-ic svg{width:20px;height:20px}
.related h4{font-size:14.5px}

/* ---------- Dropzone ---------- */
.dropzone{position:relative;border:1.5px dashed var(--border-strong);border-radius:20px;padding:58px 24px;text-align:center;background:linear-gradient(180deg,var(--surface-2),var(--surface));transition:border-color .25s,background .25s,transform .25s var(--ease);cursor:pointer}
.dropzone:hover{border-color:var(--primary)}
.dropzone.drag{border-color:var(--primary);background:var(--primary-soft);transform:scale(1.005)}
.dz-icon{width:86px;height:86px;margin:0 auto 22px;position:relative}
.dz-icon .dz-doc{fill:var(--surface);stroke:var(--border-strong)}
.dz-icon .dz-fold{fill:var(--surface-3);stroke:var(--border-strong)}
.dz-icon .dz-arrow{stroke:var(--primary)}
.dz-icon .dz-circle{fill:var(--primary)}
.dropzone:hover .dz-up,.dropzone.drag .dz-up{animation:bob 1.2s var(--ease) infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.dropzone h3{font-size:21px;font-weight:700}
.dz-or{display:flex;align-items:center;gap:12px;justify-content:center;color:var(--text-3);font-size:12.5px;text-transform:uppercase;letter-spacing:.12em;margin:14px auto;max-width:260px}
.dz-or::before,.dz-or::after{content:"";flex:1;height:1px;background:var(--border)}
.dz-formats{margin-top:20px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:12.5px;color:var(--text-2)}
.dz-formats span{padding:4px 10px;border-radius:999px;background:var(--surface-3);font-weight:600;font-size:11.5px;letter-spacing:.04em}
.dz-note{margin-top:12px;font-size:12.5px;color:var(--text-3);display:flex;gap:6px;align-items:center;justify-content:center}
.dz-note svg{width:14px;height:14px}

/* ---------- Ready layout ---------- */
.ready{display:grid;grid-template-columns:1.25fr .9fr;gap:26px}
@media (max-width:900px){.ready{grid-template-columns:1fr}}
.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}

/* page grid (split) */
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;margin-top:16px;max-height:420px;overflow:auto;padding:4px}

.pg .pimg{aspect-ratio:1/1.35;border-radius:6px;background:var(--surface-3);overflow:hidden;display:grid;place-items:center}
.pg .pimg img{width:100%;height:100%;object-fit:contain;background:#fff}
.pg span{display:block;text-align:center;font-size:11.5px;color:var(--text-2);margin-top:5px;font-weight:600}
.pg .ck{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:7px;background:var(--surface);border:1.5px solid var(--border-strong);display:grid;place-items:center;color:#fff;transition:all .2s}

@keyframes sk{to{background-position:-200% 0}}

/* ---------- Processing ---------- */
.proc{max-width:520px;margin:30px auto;text-align:center}
.proc-art{width:120px;height:120px;margin:0 auto 26px;position:relative;display:grid;place-items:center}
.proc-art::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--primary-soft);animation:breathe 2s ease-in-out infinite}
.proc-art::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid transparent;border-top-color:var(--primary);border-right-color:var(--accent);animation:spin 1.1s linear infinite}
.proc-art svg{width:56px;height:56px;position:relative}
.proc-art .lm-f1,.proc-art .lm-f2{stroke-dasharray:30;animation:draw 1.6s var(--ease) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(.92)}50%{transform:scale(1)}}
@keyframes draw{0%{stroke-dashoffset:30}50%{stroke-dashoffset:0}100%{stroke-dashoffset:-30}}
.proc h2{font-size:23px;font-weight:800}
.proc .label{color:var(--text-2);margin-top:8px;min-height:24px}
.bar{height:10px;border-radius:999px;background:var(--surface-3);overflow:hidden;margin:26px 0 10px;position:relative}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .35s var(--ease);position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-100%);animation:shine 1.4s infinite}

.proc-steps span{font-size:12px;padding:5px 11px;border-radius:999px;background:var(--surface-3);color:var(--text-3);font-weight:600;transition:all .3s}
.proc-steps span.on{background:var(--primary-soft);color:var(--primary)}
.proc-steps span.ok{background:var(--success-soft);color:var(--success)}

/* ---------- Done / Error ---------- */
.done{max-width:640px;margin:16px auto;text-align:center}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(11,22,36,.45);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px;animation:fade .2s}

.toasts{position:fixed;right:20px;bottom:20px;z-index:90;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{display:flex;align-items:center;gap:12px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow-lg);font-size:13.5px;font-weight:500;animation:toastIn .35s var(--ease);max-width:380px}

.toast.out{animation:toastOut .25s var(--ease) forwards}

@keyframes toastOut{to{opacity:0;transform:translateX(20px)}}

.pw-eye{position:absolute;right:4px;top:4px;width:34px;height:34px;border:0;background:transparent;border-radius:9px;color:var(--text-2);cursor:pointer;display:grid;place-items:center}
.pw-eye:hover{background:var(--surface-3);color:var(--text)}
.pw-eye svg{width:18px;height:18px}
.meter{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px}
.meter i{height:5px;border-radius:9px;background:var(--surface-3);transition:background .3s}
.meter.s1 i:nth-child(-n+1){background:var(--danger)}
.meter.s2 i:nth-child(-n+2){background:var(--warning)}
.meter.s3 i:nth-child(-n+3){background:var(--primary)}
.meter.s4 i{background:var(--success)}
.swatches{display:flex;gap:10px}
.swatch{width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--border-strong);cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s}
.swatch:hover{transform:scale(1.08)}
.swatch.on{box-shadow:0 0 0 2px var(--primary)}
.pos-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:auto auto;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px;aspect-ratio:1.6/1;max-width:200px}
.pos-grid button{border:1px dashed var(--border-strong);border-radius:7px;background:transparent;cursor:pointer;display:grid;transition:all .2s}
.pos-grid button i{width:16px;height:4px;border-radius:3px;background:var(--text-3);margin:6px;transition:background .2s}
.pos-grid button:nth-child(-n+3){align-items:start}.pos-grid button:nth-child(n+4){align-items:end}
.pos-grid button:nth-child(3n+1){justify-items:start}.pos-grid button:nth-child(3n+2){justify-items:center}.pos-grid button:nth-child(3n){justify-items:end}
.pos-grid button:hover{background:var(--surface-3)}
.pos-grid button.on{border-style:solid;border-color:var(--primary);background:var(--primary-soft)}
.pos-grid button.on i{background:var(--primary)}

/* page grid: organize / rotate */
.pg.org{cursor:grab}
.girar .pg.org,.pg.org:not([draggable]){cursor:pointer}
.pg .rotbox{width:100%;height:100%;display:grid;place-items:center;transition:transform .35s var(--ease)}
.pg .rotbox img{width:100%;height:100%;object-fit:contain;background:#fff}
.pg span em{font-style:normal;color:var(--primary)}
.pg.rotated{border-color:var(--accent)}
.pg-tools{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transform:translateY(-3px);transition:all .2s var(--ease)}
.pg:hover .pg-tools,.pg:focus-within .pg-tools,.pg:focus .pg-tools{opacity:1;transform:none}
.pt{width:26px;height:26px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow-sm)}
.pt svg{width:14px;height:14px}
.pt:hover{color:var(--primary);border-color:var(--primary)}
.pt.del:hover{color:var(--danger);border-color:var(--danger)}
.pt.static{pointer-events:none}
.pg.dragging{opacity:.4}
.pg.drop-before{box-shadow:-4px 0 0 0 var(--primary)}
.pg.drop-after{box-shadow:4px 0 0 0 var(--primary)}
.pg:focus-visible{box-shadow:var(--ring);border-color:var(--primary)}

/* overlay preview (watermark / numbers) */
.ovp-page{position:relative;width:min(300px,100%);aspect-ratio:1/1.414;margin:0 auto;border-radius:10px;border:1px solid var(--border);overflow:hidden;background:#fff;box-shadow:var(--shadow)}
.ovp-page img{width:100%;height:100%;object-fit:contain;display:block}
.ovp-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.num-mark{font-family:Helvetica,Arial,sans-serif;color:#4A5568;white-space:nowrap;background:rgba(85,181,245,.18);outline:1px dashed rgba(40,120,208,.6);padding:0 2px;border-radius:2px}

/* processing / done */
.proc-note{margin-top:18px;font-size:12.5px;color:var(--text-3);display:flex;gap:6px;align-items:center;justify-content:center}
.proc-note svg{width:14px;height:14px}
.done-ic.neutral{background:var(--primary-soft);color:var(--primary)}
.done-ic.neutral::after{border-color:var(--primary)}
.done-foot{margin-top:18px;font-size:12.5px;color:var(--text-3)}
.chain{margin-top:24px;padding:16px;border-radius:16px;background:var(--surface-2);border:1px solid var(--border)}
.chain-t{display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:12px}
.chain-t svg{width:16px;height:16px}
.chain-list{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;font-size:13px;cursor:pointer;transition:all .2s var(--ease)}
.chip svg{width:16px;height:16px;color:var(--primary)}
.chip:hover{border-color:var(--primary);background:var(--primary-soft);transform:translateY(-1px)}
.f-actions .mini{flex:none}

/* drawer */
#drawer{position:fixed;inset:0;z-index:70;pointer-events:none}
#drawer.open{pointer-events:auto}
.drawer-ov{position:absolute;inset:0;background:rgba(11,22,36,.35);opacity:0;transition:opacity .3s}
#drawer.open .drawer-ov{opacity:1}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s var(--ease)}
#drawer.open .drawer{transform:none}
.drawer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:22px 22px 16px;border-bottom:1px solid var(--border)}
.drawer-head h3{font-size:18px;font-weight:800}
.drawer-head small{color:var(--text-2);font-size:12.5px}
.drawer-body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.drawer-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end}
.h-item{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:14px;animation:itemIn .3s var(--ease)}
.h-ic{width:38px;height:38px;border-radius:11px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}
.h-ic svg{width:19px;height:19px}
.h-meta{flex:1;min-width:0}
.h-meta b{font-size:13.5px;display:block}
.h-meta small{font-size:12px;color:var(--text-2)}
.h-name{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-act{display:flex;gap:2px}
.h-empty{margin:auto;text-align:center;color:var(--text-2);display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px;font-size:13.5px}
.h-empty svg{width:40px;height:40px;color:var(--text-3)}
.h-empty b{color:var(--text);font-size:15px}

/* modal variants */
.modal.wide{width:min(720px,100%)}
.modal.preview{width:min(920px,100%);height:min(88vh,1000px);display:flex;flex-direction:column;padding:22px}
.modal.preview h3{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:10px}
.modal.preview .m-body{flex:1;display:flex;flex-direction:column;min-height:0;margin-top:6px}
.pv-head{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text-2);margin-bottom:14px;flex-wrap:wrap}
.pv-actions{margin-left:auto;display:flex;gap:8px}
.pv-body{flex:1;overflow:auto;background:var(--surface-3);border-radius:14px;padding:20px;min-height:0}
.pv-pages{display:flex;flex-direction:column;align-items:center;gap:18px}
.pv-page{margin:0;position:relative;min-height:240px;min-width:min(760px,100%);border-radius:6px;overflow:hidden;box-shadow:var(--shadow)}
.pv-page canvas{display:block;max-width:100%;height:auto}
.pv-page figcaption{position:absolute;bottom:8px;right:10px;font-size:11px;font-weight:700;background:rgba(20,43,69,.75);color:#fff;padding:2px 8px;border-radius:999px}
.pv-img{display:block;max-width:100%;max-height:100%;margin:auto;border-radius:8px;box-shadow:var(--shadow);background:#fff}
.pv-msg{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text-2);text-align:center;font-size:13.5px}
.pv-msg svg{width:40px;height:40px;color:var(--text-3)}
.pv-msg b{color:var(--text);font-size:15px}
.pv-loading{height:100%;display:grid;place-items:center}
.pv-zip{display:flex;flex-direction:column;gap:8px}
.pv-docx .docx-wrapper{background:transparent!important;padding:0!important}
.pv-docx section.docx{box-shadow:var(--shadow)!important;margin-bottom:18px!important}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.pick{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:14px;background:var(--surface);cursor:pointer;font-weight:600;font-size:13.5px;color:var(--text);text-align:left;transition:all .2s var(--ease)}
.pick .tool-ic{width:38px;height:38px;border-radius:11px}
.pick .tool-ic svg{width:19px;height:19px}
.pick:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow)}
.pick:hover .tool-ic{background:var(--primary);color:#fff}
.kbd-list{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.kbd-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:8px 0;border-bottom:1px solid var(--border);color:var(--text)}
.kbd-row:last-child{border-bottom:0}
.kbd-sub{margin-top:14px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--text-3)}
.toast-act{margin-left:8px;border:0;background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:12.5px;padding:6px 10px;border-radius:8px;cursor:pointer}

/* drop overlay */
#drop-ov{position:fixed;inset:0;z-index:85;display:grid;place-items:center;background:rgba(11,22,36,.55);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .2s}
#drop-ov.show{opacity:1}
#drop-ov .dbox{border:2px dashed rgba(255,255,255,.65);border-radius:28px;padding:56px 70px;text-align:center;color:#fff;display:flex;flex-direction:column;align-items:center;gap:10px;transform:scale(.96);transition:transform .3s var(--ease)}
#drop-ov.show .dbox{transform:none}
#drop-ov svg.big{width:76px;height:76px;margin-bottom:10px;animation:bob 1.2s var(--ease) infinite}
#drop-ov b{font-family:var(--font-display);font-size:24px}
#drop-ov span{color:#C9D9EA;font-size:14.5px}

/* legal */
.legal{max-width:780px;margin:0 auto}
.legal .page-title .eyebrow{margin-bottom:14px}
.legal-body{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:36px 40px;box-shadow:var(--shadow-sm);font-size:15px;line-height:1.75;color:var(--text)}
.legal-body .lead{font-size:16.5px;color:var(--text-2);margin-bottom:8px}
.legal-body h2{font-size:18px;font-weight:800;margin:28px 0 8px}
.legal-body p{margin:8px 0}
.legal-body ul{padding-left:20px;margin:8px 0}
.legal-body li{margin:4px 0}
.legal-foot{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
@media (max-width:700px){.legal-body{padding:24px 20px}}

/* offscreen docx rendering */
.docx-host{position:fixed;left:-20000px;top:0;width:auto;background:#fff;z-index:-1}
.docx-host section.docx{margin:0!important;box-shadow:none!important}
/* header density */
main:focus-visible{box-shadow:none}
.nav a{white-space:nowrap}
.logo-text{white-space:nowrap}
.platform-pill{white-space:nowrap}
@media (max-width:1240px){.platform-pill{display:none}}
.pg.org .pimg{background:var(--surface-2)}
html,body{overflow-x:hidden}
@media (max-width:480px){.tagline{display:none}.header-right{gap:6px}.icon-btn{width:38px;height:38px}.logo-mark{width:32px;height:32px}}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.overlay{-webkit-backdrop-filter:blur(4px)}
#drop-ov{-webkit-backdrop-filter:blur(6px)}

/* ===== Assinar PDF ===== */
.ol-sub{font-weight:500;color:var(--text-3);font-size:11.5px;margin-left:4px}
.sg-pad-wrap{position:relative;border:1.5px dashed var(--border-strong);border-radius:14px;background:#fff;overflow:hidden;touch-action:none}
.sg-pad{display:block;width:100%;height:170px;cursor:crosshair;touch-action:none}
.sg-pad-hint{position:absolute;left:0;right:0;top:44%;text-align:center;color:#9AA8BA;font-size:13px;pointer-events:none;letter-spacing:.04em}
.sg-line{position:absolute;left:22px;right:22px;bottom:38px;border-bottom:1px solid #D5DEEA;pointer-events:none}
.sg-line::before{content:"×";position:absolute;left:-4px;bottom:2px;color:#9AA8BA;font-size:14px}
.sg-pad-tools{margin-top:8px;justify-content:flex-end}
.sg-fonts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.sg-fonts button{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--border);background:#fff;border-radius:12px;padding:8px 14px;cursor:pointer;transition:all .2s;min-height:56px}
.sg-fonts button:hover{border-color:var(--border-strong)}
.sg-fonts button.on{border-color:var(--primary);box-shadow:var(--ring)}
.sg-font-prev{font-size:30px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:78%}
.sg-fonts small{font-size:11.5px;color:#718096;font-weight:600}
.sg-upload{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:1.5px dashed var(--border-strong);background:var(--surface);border-radius:14px;padding:14px;cursor:pointer;color:var(--text);transition:all .2s}
.sg-upload:hover{border-color:var(--primary);background:var(--primary-soft)}
.sg-upload svg{width:22px;height:22px;color:var(--primary);flex:none}
.sg-upload b{display:block;font-size:13.5px}.sg-upload small{color:var(--text-2);font-size:12px}
.sg-img-prev{margin:10px 0;border-radius:12px;border:1px solid var(--border);background:repeating-conic-gradient(#EEF3F9 0 25%,#fff 0 50%) 0 0/16px 16px;padding:10px;display:grid;place-items:center}
.sg-img-prev img{max-width:100%;max-height:110px}
.sg-saved{display:flex;gap:8px;flex-wrap:wrap}
.sg-chip{height:52px;min-width:90px;max-width:150px;border:1px solid var(--border);background:#fff;border-radius:10px;padding:6px 10px;cursor:pointer;display:grid;place-items:center;transition:all .2s}
.sg-chip img{max-height:38px;max-width:128px}
.sg-chip:hover{border-color:var(--primary);transform:translateY(-1px)}
.sg-chip.on{border-color:var(--primary)}
.sg-list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.sg-li{display:flex;align-items:center;gap:4px;border:1px solid var(--border);border-radius:10px;padding:4px 4px 4px 6px;background:var(--surface)}
.sg-li.on{border-color:var(--primary)}
.sg-li-main{flex:1;display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;color:var(--text);font-size:13px;font-weight:600;padding:2px;text-align:left}
.sg-li-main img{height:26px;max-width:80px;background:#fff;border-radius:5px}
.sv{margin-top:18px}
.sv-bar{display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:13.5px;color:var(--text-2)}
.sv-bar b{color:var(--text)}
.sv-tip{margin-left:auto;font-size:12px;color:var(--text-3)}
.sv-stage{background:var(--surface-3);border-radius:16px;padding:18px;display:grid;place-items:center}
.sv-page{position:relative;width:min(560px,100%);background:#fff;box-shadow:var(--shadow-lg);border-radius:4px;user-select:none;-webkit-user-select:none}
.sv-page > img{display:block;width:100%;height:100%;border-radius:4px;pointer-events:none}
.sp-box{position:absolute;cursor:move;border:1.5px dashed transparent;border-radius:4px;touch-action:none;transition:border-color .15s,box-shadow .15s}
.sp-box img{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block}
.sp-box:hover,.sp-box.on,.sp-box:focus-visible{border-color:var(--primary);background:rgba(40,120,208,.05)}
.sp-box:focus-visible{box-shadow:var(--ring);outline:none}
.sp-box.dragging{box-shadow:0 10px 24px -8px rgba(20,43,69,.35)}
.sp-del{position:absolute;top:-11px;right:-11px;width:22px;height:22px;border-radius:50%;border:0;background:var(--danger);color:#fff;display:none;place-items:center;cursor:pointer;box-shadow:var(--shadow-sm)}
.sp-del svg{width:12px;height:12px}
.sp-box:hover .sp-del,.sp-box.on .sp-del,.sp-box:focus-within .sp-del{display:grid}
.sp-handle{position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;border-radius:4px;background:var(--primary);border:2px solid #fff;cursor:nwse-resize;display:none;box-shadow:var(--shadow-sm)}
.sp-box:hover .sp-handle,.sp-box.on .sp-handle,.sp-box:focus .sp-handle{display:block}
.sp-date{position:absolute;left:2px;top:100%;margin-top:2px;font:600 clamp(6px,1.2vw,9px)/1 Helvetica,Arial,sans-serif;color:#59667A;white-space:nowrap;pointer-events:none}

/* ===== Lote ===== */
.skip-tag{color:var(--warning);font-weight:600}
.pick-sub{display:block;font-size:11px;font-weight:600;color:var(--primary);margin-top:1px}
.sv-file{max-width:220px;height:32px;font-size:12.5px;padding:0 30px 0 10px;margin-left:8px}
</style>

<body>
<div id="app"></div>
<div id="drawer"></div>
<div id="drop-ov" aria-hidden="true"><div class="dbox"><svg class="big" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5V4M7.5 8.5 12 4l4.5 4.5"/><path d="M4 15v2.5A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5V15"/></svg><b>Solte seus arquivos</b><span></span></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="picker" class="sr" multiple tabindex="-1" aria-hidden="true">
<script>
/* =========================================================
   Operações de PDF (executadas em Web Worker, com fallback no
   thread principal). Esta função é serializada via toString():
   não pode referenciar nada fora do seu próprio escopo.
   ========================================================= */
function makeOps(PDFLib, JSZip, env) {
  const {PDFDocument, StandardFonts, rgb, degrees, PDFName, PDFRawStream, PDFArray, PDFNumber, PDFRef, decodePDFRawStream,
    setTextRenderingMode, TextRenderingMode, setCharacterSqueeze, beginText, endText, setFontAndSize, showText, setTextMatrix, pushGraphicsState, popGraphicsState} = PDFLib;
  const P = (p, l) => env.progress(p, l);
  const err = (m, code) => Object.assign(new Error(m), {code});
  const meta = d => { d.setProducer('FileFlow'); d.setCreator('FileFlow — Intelligent Document Solutions'); };

  async function load(bytes, password, label) {
    const who = label ? ` “${label}”` : '';
    try { return await PDFDocument.load(bytes, {updateMetadata: false}); }
    catch (e) {
      const enc = e && (e.name === 'EncryptedPDFError' || /encrypt/i.test(e.message || ''));
      if (!enc) throw err(`Não foi possível ler o PDF${who}. O arquivo pode estar corrompido.`, 'invalid');
      try { return await PDFDocument.load(bytes, {password: password || '', updateMetadata: false}); }
      catch (e2) {
        if (/incorrect/i.test(e2.message || '')) throw err(password ? 'Senha incorreta. Verifique e tente novamente.' : `O PDF${who} está protegido por senha. Use a ferramenta “Desproteger PDF” primeiro.`, 'password');
        throw err(`Não foi possível abrir o PDF protegido${who}.`, 'invalid');
      }
    }
  }
  const save = d => d.save({useObjectStreams: true});

  const charOk = new Map();
  function cleanText(font, text) {
    let out = '';
    for (const ch of String(text).normalize('NFC')) {
      let ok = charOk.get(ch);
      if (ok === undefined) { try { font.widthOfTextAtSize(ch, 10); ok = true; } catch (e) { ok = false; } charOk.set(ch, ok); }
      if (ok) out += ch; /* caracteres fora do conjunto da fonte são descartados */
    }
    return out;
  }

  /* ---------- Compressão: recodifica imagens incorporadas ---------- */
  async function encodeJpeg(source, w, h, q) {
    const c = env.canvas(w, h); const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(source, 0, 0, w, h);
    const blob = await env.toBlob(c, 'image/jpeg', q);
    return new Uint8Array(await blob.arrayBuffer());
  }
  function numOf(o) { return o && typeof o.asNumber === 'function' ? o.asNumber() : (o && o.numberValue) || 0; }
  function components(doc, cs) {
    if (!cs) return 0;
    if (cs instanceof PDFName) return {'/DeviceRGB': 3, '/DeviceGray': 1, '/DeviceCMYK': 4, '/CalRGB': 3, '/CalGray': 1}[cs.toString()] || 0;
    if (cs instanceof PDFArray) {
      const kind = cs.get(0) && cs.get(0).toString();
      if (kind === '/ICCBased') { const s = doc.context.lookup(cs.get(1)); const n = s && s.dict && s.dict.get(PDFName.of('N')); return numOf(n); }
      if (kind === '/CalRGB') return 3; if (kind === '/CalGray') return 1;
    }
    return 0;
  }

  return {
    async merge({files, title}) {
      const out = await PDFDocument.create();
      for (let i = 0; i < files.length; i++) {

  if (!parts.length) throw new Error('Informe ao menos uma página ou intervalo (ex.: 1-3, 5).');
  for (const p of parts) {
    const m = p.match(/^(\d+)\s*(?:-|–|a|até)\s*(\d+|fim|final|end)$/i);
    if (m) {
      const a = +m[1], b = /^\d+$/.test(m[2]) ? +m[2] : max;

function defaultImgPdfName() { const f = state.files[0]; return state.files.length > 1 ? 'imagens-convertidas' : (f ? baseName(f.name) : 'documento'); }

function summaryInfo() {
  const t = state.tool, o = state.opts, fs = state.files, f = fs[0];
  let n = '—', detail = '';
  if (t.batch && fs.length > 1) {
    const ok = fs.filter(x => !batchSkip(x)).length;
    return {n: `${ok} ${ok === 1 ? 'PDF' : 'PDFs'}`, detail: (t.id === 'comprimir-pdf' ? `original: ${fmtBytes(fs.reduce((a, x) => a + x.size, 0))} · ` : '') + (settings.autoZip ? 'em um .zip' : 'arquivos separados')};
  }
  try {
    if (['pdf-para-jpg','pdf-para-png','pdf-para-imagem','pdf-para-word'].includes(t.id) && f?.pages) {
      const pages = o.pages === 'range' && o.range.trim() ? parseRanges(o.range, f.pages).flat() : null;
      const count = pages ? pages.length : f.pages;
      if (t.id === 'pdf-para-word') { n = '1 documento'; detail = count + (count === 1 ? ' página' : ' páginas'); }
      else { n = count + (count === 1 ? ' imagem' : ' imagens'); detail = count > 1 && settings.autoZip ? 'compactadas em .zip' : ''; }
    } else if (t.id === 'juntar-pdf') { const p = fs.reduce((s, x) => s + (x.pages || 0), 0); n = '1 PDF'; detail = p + ' páginas no total'; }
    else if (t.id === 'dividir-pdf' && f?.pages) {
      let c = 0;
      if (o.mode === 'each') c = f.pages; else if (o.mode === 'ranges') c = o.ranges.trim() ? parseRanges(o.ranges, f.pages).length : 0; else c = o.selected.size ? (o.selOut === 'single' ? 1 : o.selected.size) : 0;
      n = c + (c === 1 ? ' PDF' : ' PDFs'); detail = c > 1 && settings.autoZip ? 'compactados em .zip' : '';
    } else if (t.id.endsWith('-para-pdf') && t.id !== 'word-para-pdf') { n = '1 PDF'; detail = fs.length + (fs.length === 1 ? ' página' : ' páginas'); }
    else if (t.id === 'organizar-pdf' || t.id === 'girar-pdf') { n = '1 PDF'; detail = (o.pageList?.length || 0) + ' páginas'; }
    else if (t.id === 'comprimir-pdf' && f) { n = '1 PDF'; detail = 'original: ' + fmtBytes(f.size); }
    else if (t.id === 'word-para-pdf' && f) { n = '1 PDF'; }
    else if (t.id === 'assinar-pdf' && f) { n = '1 PDF'; const k = o.placements.length; detail = k ? `${k} ${k === 1 ? 'assinatura' : 'assinaturas'} em ${new Set(o.placements.map(p => p.page)).size} pág.` : 'nenhuma assinatura'; }

function renderStage() { const s = $('#stage'); if (!s) return render(); s.innerHTML = stageHTML(); afterRender(); }

/* =========================================================
   File intake
   ========================================================= */
const picker = $('#picker');
let pickerMode = 'tool';
function openPicker(any = false) {
  const t = state.tool;
  pickerMode = any || !t ? 'any' : 'tool';
  if (pickerMode === 'any') { picker.accept = '.pdf,.jpg,.jpeg,.png,.docx,application/pdf,image/jpeg,image/png'; picker.multiple = true; }
  else {
    picker.accept = t.accept.map(a => '.' + a).join(',') + (t.accept.includes('pdf') ? ',application/pdf' : '') + (t.accept.includes('jpg') ? ',image/jpeg' : '') + (t.accept.includes('png') ? ',image/png' : '');
    picker.multiple = manyFiles(t);
  }
  picker.value = ''; picker.click();
}
picker.addEventListener('change', () => { if (!picker.files.length) return; const fs = [...picker.files]; picker.value = ''; pickerMode === 'any' ? smartOpen(fs) : addFiles(fs); });

function detectKind(file) {
  const e = extOf(file.name), ty = file.type;
  if (e === 'pdf' || ty === 'application/pdf') return 'pdf';
  if (['jpg','jpeg'].includes(e) || ty === 'image/jpeg') return 'jpg';
  if (e === 'png' || ty === 'image/png') return 'png';
  if (e === 'docx' || ty === MIME.docx) return 'docx';
  return e;
}
async function addFiles(list) {
  const t = state.tool; if (!t) return smartOpen(list);
  if (!['upload', 'ready'].includes(state.phase)) { resetTool(); state.opts = defaultOpts(t.id); }
  const ok = [], rejected = [];
  for (const file of list) {
    const kind = detectKind(file);
    const allowed = t.accept.includes(kind) || (kind === 'jpg' && t.accept.includes('jpeg'));
    if (!allowed) { rejected.push(`${file.name}: formato não suportado por esta ferramenta`); continue; }
    if (file.size > settings.maxSizeMB * 1048576) { rejected.push(`${file.name}: excede ${settings.maxSizeMB} MB`); continue; }
    if (file.size === 0) { rejected.push(`${file.name}: arquivo vazio`); continue; }
    ok.push({id: Math.random().toString(36).slice(2), file, name: file.name || `arquivo-colado.${kind}`, size: file.size, kind: kind === 'pdf' ? 'pdf' : kind === 'docx' ? 'docx' : 'img', loading: true});
  }
  if (rejected.length) toast(rejected.length === 1 ? rejected[0] : `${rejected.length} arquivos ignorados: formato ou tamanho inválido.`, 'error', 5000);
  if (!ok.length) return;
  if (!manyFiles(t)) { state.files.forEach(f => { try { f.pdf?.destroy(); } catch (e) {} }); state.files = [ok[0]]; if (t.id === 'dividir-pdf') state.opts.selected = new Set(); state.opts.pageList = null; if (t.id === 'assinar-pdf') { state.opts.placements = []; state.opts.page = 1; state.opts.active = null; } }
  else state.files.push(...ok);
  if (manyFiles(t) && ok.length && (state.files.length > ok.length || ok.length > 1)) toast(`${ok.length} ${ok.length === 1 ? 'arquivo adicionado' : 'arquivos adicionados'}`, 'success', 2000);
  state.phase = 'ready'; renderStage();
  await Promise.all((manyFiles(t) ? ok : [ok[0]]).map(analyze));
}
async function analyze(f) {
  try {
    f.bytes = new Uint8Array(await f.file.arrayBuffer());
    if (f.kind === 'pdf') {
      const head = new TextDecoder().decode(f.bytes.subarray(0, 1024));
      if (!head.includes('%PDF')) throw Object.assign(new Error('O arquivo não parece ser um PDF válido.'), {code:'invalid'});
      f.encrypted = isEncryptedPdf(f.bytes);
      const pdfjsLib = await lib('pdfjs');
      try { f.pdf = await pdfjsLib.getDocument({data: f.bytes.slice(), isEvalSupported: false}).promise; }
      catch (e) {
        if (e?.name === 'PasswordException') {
          if (state.tool?.id === 'desproteger-pdf') { f.needsPassword = true; f.encrypted = true; f.loading = false; if (state.route === 'tool') renderStage(); return; }
          throw Object.assign(new Error('Este PDF está protegido por senha.'), {code:'password'});
        }
        throw Object.assign(new Error('Não foi possível ler este PDF. Ele pode estar corrompido.'), {code:'invalid'});
      }
      f.pages = f.pdf.numPages; f.thumbs = {};
      const p1 = await f.pdf.getPage(1); const v = p1.getViewport({scale: 1}); f.pageW = v.width; f.pageH = v.height;
      f.thumb = await thumbOf(f, 1, 120); f.thumbs[1] = f.thumb;
      if (state.tool?.id === 'desproteger-pdf' && !f.encrypted) toast('Este PDF não possui senha nem restrições.', 'info');
    } else if (f.kind === 'docx') {
      if (f.bytes[0] !== 0x50 || f.bytes[1] !== 0x4B) throw Object.assign(new Error('O arquivo não parece ser um documento .docx válido.'), {code:'invalid'});
    } else {
      f.url = URL.createObjectURL(f.file);
      const img = await loadImage(f.url);
      f.w = img.naturalWidth; f.h = img.naturalHeight; f.thumb = f.url;
    }
  } catch (e) {
    console.error(e);
    state.files = state.files.filter(x => x !== f);
    const action = e.code === 'password' && state.tool?.id !== 'desproteger-pdf' ? {label: 'Desproteger', run: () => { state.pending = [f.file]; go('desproteger-pdf'); }} : null;
    toast(`${f.name}: ${e.message || 'falha ao ler o arquivo'}`, 'error', 6000, action);
    if (!state.files.length) state.phase = 'upload';
    if (e.code === 'network') { state.error = {title:'Motor de processamento indisponível', message:e.message, hint:'O FileFlow precisa baixar suas bibliotecas de processamento na primeira utilização.'}; state.phase = 'error'; }
  }
  f.loading = false;
  if (state.route === 'tool' && state.phase !== 'processing' && state.phase !== 'done') renderStage();
}
function loadImage(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Imagem inválida ou corrompida.')); i.src = src; }); }
async function thumbOf(f, n, w) {
  const page = await f.pdf.getPage(n);
  const vp0 = page.getViewport({scale: 1}), scale = w / vp0.width, vp = page.getViewport({scale: scale * 1.6});
  const c = document.createElement('canvas'); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  await page.render({canvasContext: ctx, viewport: vp}).promise; page.cleanup();
  return c.toDataURL('image/jpeg', .82);
}
async function ensureBigPreview() {
  const f = state.files[0];
  if (!f?.pdf || f.big || f.bigLoading || !$('#ovp')) return;
  f.bigLoading = true;
  try { const n = state.opts.skipFirst && f.pages > 1 ? 2 : 1; f.big = await thumbOf(f, n, 300); } catch (e) {}
  f.bigLoading = false;
  const box = $('#ovp'); if (box && f.big) { box.classList.remove('skeleton'); box.insertAdjacentHTML('afterbegin', `<img src="${f.big}" alt="Página do documento">`); updateOverlayPreview(); }
}

/* ---------- Smart routing (drop / paste anywhere) ---------- */
async function smartOpen(files) {
  const kinds = files.map(detectKind);
  const all = k => kinds.every(x => x === k);
  let target = null;
  if (all('pdf')) {
    if (files.length > 1) {
      const opts = TOOLS.filter(t => t.multi && t.accept.includes('pdf') || t.batch);
      target = await modal({title: `O que deseja fazer com estes ${files.length} PDFs?`, icon: 'layers', wide: true, actions: [],
        body: `<p style="margin-bottom:14px">Juntar em um único arquivo ou aplicar a mesma operação a cada um deles.</p><div class="pick-grid">${opts.map(t => `<button class="pick" data-modal-val="${t.id}"><span class="tool-ic">${ICONS[t.icon]}</span><span>${esc(t.name)}${t.batch ? '<small class="pick-sub">em lote</small>' : ''}</span></button>`).join('')}</div>`});
    } else {
      const opts = TOOLS.filter(t => t.accept.includes('pdf') && !t.multi);
      target = await modal({title: 'O que deseja fazer com este PDF?', icon: 'file', wide: true, actions: [],
        body: `<p style="margin-bottom:14px"><b>${esc(files[0].name)}</b> · ${fmtBytes(files[0].size)}</p><div class="pick-grid">${opts.map(t => `<button class="pick" data-modal-val="${t.id}"><span class="tool-ic">${ICONS[t.icon]}</span><span>${esc(t.name)}</span></button>`).join('')}</div>`});
    }
  } else if (kinds.every(k => k === 'jpg' || k === 'png')) target = all('png') ? 'png-para-pdf' : 'jpg-para-pdf';
  else if (all('docx')) target = 'word-para-pdf';
  else { toast('Formato não suportado. Use PDF, JPG, PNG ou DOCX.', 'error'); return; }
  if (!target) return;
  state.pending = files;
  if (state.tool?.id === target && ['upload', 'ready'].includes(state.phase)) { state.pending = null; addFiles(files); }
  else go(target);
}

async function previewFile({name, blob, file, pdf}) {
  const ext = extOf(name), size = blob?.size ?? file?.size;
  let cleanup = () => {};
  await modal({title: name, icon: null, wide: true, actions: [], body: `
    <div class="pv-head"><span class="tag">${ext.toUpperCase()}</span><span>${fmtBytes(size)}</span><span id="pv-info"></span>
      <div class="pv-actions">${blob ? `<button class="btn btn-primary btn-sm" id="pv-dl">${ICONS.download} Baixar</button>` : ''}<button class="btn btn-secondary btn-sm" data-modal-val="close">${ICONS.x} Fechar</button></div></div>
    <div class="pv-body" id="pv-body"><div class="pv-loading"><div class="skeleton" style="width:60%;height:70%;border-radius:8px"></div></div></div>`,
    onOpen: async (ov) => {
      ov.querySelector('.modal').classList.add('preview');
      ov.querySelector('#pv-dl')?.addEventListener('click', () => download(blob, name));
      const body = ov.querySelector('#pv-body'), info = ov.querySelector('#pv-info');
      try {
        if (ext === 'pdf') {
          const pdfjsLib = await lib('pdfjs');

          if (!doc) { try { doc = await pdfjsLib.getDocument({data: new Uint8Array(await blob.arrayBuffer()), isEvalSupported: false}).promise; } catch (e) { if (e?.name === 'PasswordException') { body.innerHTML = `<div class="pv-msg">${ICONS.lock}<b>Documento protegido por senha</b><span>A pré-visualização exige a senha. O arquivo foi gerado corretamente.</span></div>`; return; } throw e; } cleanup = () => doc.destroy(); }
          const n = Math.min(doc.numPages, 50);
          info.textContent = `· ${doc.numPages} ${doc.numPages === 1 ? 'página' : 'páginas'}${doc.numPages > 50 ? ' (mostrando 50)' : ''}`;
          body.innerHTML = `<div class="pv-pages">${Array.from({length: n}, (_, i) => `<figure class="pv-page skeleton" data-n="${i + 1}"><figcaption>${i + 1}</figcaption></figure>`).join('')}</div>`;
          const io = new IntersectionObserver(async es => {
            for (const en of es) {

              const k = +en.target.dataset.n, page = await doc.getPage(k), v1 = page.getViewport({scale: 1});
              const wTarget = Math.min(760, body.clientWidth - 40), sc = wTarget / v1.width * (window.devicePixelRatio > 1 ? 1.6 : 1.1), vp = page.getViewport({scale: sc});

              en.target.classList.remove('skeleton'); en.target.prepend(c);
            }

          const prevClean = cleanup; cleanup = () => { io.disconnect(); prevClean(); };
        } else if (['jpg', 'jpeg', 'png', 'webp'].includes(ext)) {
          const url = URL.createObjectURL(blob || file); cleanup = () => URL.revokeObjectURL(url);
          body.innerHTML = `<img class="pv-img" src="${url}" alt="${esc(name)}">`;
          const im = body.querySelector('img'); im.onload = () => info.textContent = `· ${im.naturalWidth}×${im.naturalHeight}px`;
        } else if (ext === 'docx') {

          body.innerHTML = `<div class="pv-zip">${entries.map(e => `<div class="file-item"><div class="thumb">${outputIcon(e.name)}</div><div class="fmeta"><div class="fname">${esc(e.name)}</div><div class="fsub"><span class="tag">${extOf(e.name).toUpperCase()}</span><span class="dot"></span><span>${fmtBytes(e._data?.uncompressedSize || 0)}</span></div></div><button class="mini" data-zip="${esc(e.name)}" aria-label="Pré-visualizar ${esc(e.name)}">${ICONS.eye}</button></div>`).join('')}</div>`;

/* ---------- Word → PDF (imagem fiel + camada de texto invisível) ---------- */

function placeSignature(sig) {
  const o = state.opts, f = sgFile(), ratio = f.signRatio?.[o.page] || 1.414;
  const fw = Math.min(0.32, 0.32 * Math.max(0.6, Math.min(1.4, 3.2 / (sig.w / sig.h)))), fh = fw * (sig.h / sig.w) / ratio;
  const onPage = o.placements.filter(p => fromRef(p, f) === o.page).length;
  const pl = {id: Math.random().toString(36).slice(2), sig: sig.id, page: o.page, refPages: f.pages, fw, fh, fx: Math.max(0.02, 0.92 - fw - onPage * 0.04), fy: Math.max(0.02, Math.min(0.98 - fh, 0.78 - onPage * 0.08))};
  o.placements.push(pl); o.active = pl.id; o.activeSig = sig.id;
  renderSignViewer(); refreshOptions();
  setTimeout(() => { const el = $(`.sp-box[data-pl="${pl.id}"]`); if (!el) return; el.focus({preventScroll: true}); el.scrollIntoView({behavior: settings.reduceMotion ? 'auto' : 'smooth', block: 'center'}); }, 30);
}
function updateBoxStyle(p) { const el = $(`.sp-box[data-pl="${p.id}"]`); if (el) Object.assign(el.style, {left: p.fx * 100 + '%', top: p.fy * 100 + '%', width: p.fw * 100 + '%', height: p.fh * 100 + '%'}); }
const clamp01 = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
function resizePl(p, fw) {
  const s = SIGS.find(x => x.id === p.sig), f = sgFile(), ratio = f.signRatio?.[fromRef(p, f) || p.page] || 1.414;
  p.fw = clamp01(fw, 0.06, 0.95); p.fh = p.fw * (s.h / s.w) / ratio;
  if (p.fh > 0.9) { p.fh = 0.9; p.fw = p.fh * ratio * s.w / s.h; }
  p.fx = clamp01(p.fx, 0, 1 - p.fw); p.fy = clamp01(p.fy, 0, 1 - p.fh);
}
document.addEventListener('pointerdown', e => {
  const box = e.target.closest('.sp-box'); if (!box || e.target.closest('[data-sg]')) return;
  e.preventDefault();
  const p = state.opts.placements.find(x => x.id === box.dataset.pl); if (!p) return;
  if (state.opts.active !== p.id) { state.opts.active = p.id; $$('.sp-box').forEach(b => b.classList.toggle('on', b === box)); $$('.sg-li').forEach(li => li.classList.toggle('on', li.querySelector('[data-id]')?.dataset.id === p.id)); }
  const stage = $('#sv-page').getBoundingClientRect(), resize = !!e.target.closest('[data-handle]');
  const start = {x: e.clientX, y: e.clientY, fx: p.fx, fy: p.fy, fw: p.fw};
  box.setPointerCapture(e.pointerId); box.classList.add('dragging');
  const move = ev => {
    const dx = (ev.clientX - start.x) / stage.width, dy = (ev.clientY - start.y) / stage.height;
    if (resize) resizePl(p, start.fw + dx);
    else { p.fx = clamp01(start.fx + dx, 0, 1 - p.fw); p.fy = clamp01(start.fy + dy, 0, 1 - p.fh); }
    updateBoxStyle(p);
  };
  const up = () => { box.classList.remove('dragging'); box.removeEventListener('pointermove', move); box.removeEventListener('pointerup', up); box.removeEventListener('pointercancel', up); box.focus({preventScroll: true}); };
  box.addEventListener('pointermove', move); box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
});
document.addEventListener('keydown', e => {
  const box = e.target.closest?.('.sp-box'); if (!box || document.querySelector('.overlay')) return;
  const p = state.opts.placements.find(x => x.id === box.dataset.pl); if (!p) return;
  const st = e.shiftKey ? 0.05 : 0.01;
  const k = {ArrowLeft: [-st, 0], ArrowRight: [st, 0], ArrowUp: [0, -st], ArrowDown: [0, st]}[e.key];
  if (k) { e.preventDefault(); e.stopImmediatePropagation(); p.fx = clamp01(p.fx + k[0], 0, 1 - p.fw); p.fy = clamp01(p.fy + k[1], 0, 1 - p.fh); updateBoxStyle(p); return; }
  if (e.key === '+' || e.key === '=') { e.preventDefault(); resizePl(p, p.fw * 1.08); updateBoxStyle(p); return; }
  if (e.key === '-' || e.key === '_') { e.preventDefault(); resizePl(p, p.fw / 1.08); updateBoxStyle(p); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); e.stopImmediatePropagation(); removePlacement(p.id); }
}, true);
function removePlacement(id) {
  const o = state.opts; o.placements = o.placements.filter(p => p.id !== id); if (o.active === id) o.active = null;
  renderSignViewer(); refreshOptions();
}

/* ---------- Ações ---------- */
const sigPicker = Object.assign(document.createElement('input'), {type: 'file', accept: 'image/png,image/jpeg,.png,.jpg,.jpeg', className: 'sr', tabIndex: -1});
sigPicker.setAttribute('aria-hidden', 'true');
document.body.appendChild(sigPicker);
sigPicker.addEventListener('change', async () => {
  const file = sigPicker.files[0]; sigPicker.value = ''; if (!file) return;
  if (!/^image\/(png|jpeg)$/.test(file.type) && !/\.(png|jpe?g)$/i.test(file.name)) { toast('Use uma imagem PNG ou JPG.', 'error'); return; }
  if (state.opts.imgUrl) URL.revokeObjectURL(state.opts.imgUrl);
  state.opts.imgUrl = URL.createObjectURL(file); state.opts.imgName = file.name; state.opts.imgBytes = true;
  refreshOptions();
});
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-sg]'); if (!b || state.tool?.id !== 'assinar-pdf') return;
  e.preventDefault(); e.stopPropagation();
  const o = state.opts, f = sgFile();
  switch (b.dataset.sg) {
    case 'undo': sigPad.strokes.pop(); refreshOptions(); break;
    case 'clear': sigPad.strokes = []; refreshOptions(); break;
    case 'upload': sigPicker.click(); break;
    case 'create': {
      b.disabled = true;
      try {
        const r = await buildSignature();
        if (!r) { toast('A assinatura está vazia.', 'warn'); b.disabled = false; return; }
        const sig = {id: Math.random().toString(36).slice(2), label: o.mode === 'type' ? o.text : `Assinatura ${SIGS.length + 1}`, ...r};
        SIGS.push(sig);
        if (o.mode === 'draw') sigPad.strokes = [];
        placeSignature(sig);
        toast('Assinatura inserida — arraste para posicionar', 'success', 2600);
      } catch (err) { console.error(err); toast('Não foi possível criar a assinatura.', 'error'); b.disabled = false; }
      break;
    }
    case 'reuse': { const s = SIGS.find(x => x.id === b.dataset.id); if (s) placeSignature(s); break; }
    case 'del': removePlacement(b.dataset.id); break;
    case 'goto': { const p = o.placements.find(x => x.id === b.dataset.id); if (p) { o.page = fromRef(p, f) || Math.min(p.page, f.pages); o.active = p.id; renderSignViewer(); refreshOptions(); setTimeout(() => $(`.sp-box[data-pl="${p.id}"]`)?.focus(), 30); } break; }
    case 'all': {
      const p = o.placements.find(x => x.id === b.dataset.id); if (!p) return;
      let added = 0;
      for (let n = 1; n <= f.pages; n++) {
        if (n === fromRef(p, f) || o.placements.some(x => fromRef(x, f) === n && x.sig === p.sig && Math.abs(x.fx - p.fx) < 0.01 && Math.abs(x.fy - p.fy) < 0.01)) continue;
        o.placements.push({...p, id: Math.random().toString(36).slice(2), page: n, refPages: f.pages}); added++;
      }
      refreshOptions(); toast(added ? `Assinatura repetida em mais ${added} ${added === 1 ? 'página' : 'páginas'}` : 'Já está em todas as páginas', added ? 'success' : 'info');
      break;
    }
    case 'prev': if (o.page > 1) { o.page--; renderSignViewer(); refreshOptions(); } break;
    case 'next': if (o.page < f.pages) { o.page++; renderSignViewer(); refreshOptions(); } break;
  }
}, true);
document.addEventListener('change', e => {
  if (!e.target.matches?.('[data-sg-view]') || state.tool?.id !== 'assinar-pdf') return;
  const o = state.opts; o.view = +e.target.value; o.page = Math.min(o.page, sgFile().pages || 1); o.active = null;
  renderSignViewer(); refreshOptions();
});
document.addEventListener('input', e => {
  if (e.target.id !== 'sg-text') return;
  $$('.sg-font-prev').forEach(el => el.textContent = e.target.value || 'Sua Assinatura');
});

/* ---------- Execução ---------- */
async function signPdf() {
  const f = state.files[0], o = state.opts;
  progress(8, 'Calculando posições…');
  const placements = [], used = new Set();
  const dateText = o.date ? `Assinado em ${dateLabel()}` : '';
  const mapped = o.placements.map(p => ({...p, page: fromRef(p, f)})).filter(p => p.page);
  if (!mapped.length) throw new Error('Nenhuma das assinaturas se aplica a este arquivo (ele tem menos páginas).');
  for (const p of mapped) {
    checkCancel();
    const page = await f.pdf.getPage(p.page), vp = page.getViewport({scale: 1});
    const vx = p.fx * vp.width, vy = p.fy * vp.height, vw = p.fw * vp.width, vh = p.fh * vp.height;
    const [px, py] = vp.convertToPdfPoint(vx, vy + vh), [qx, qy] = vp.convertToPdfPoint(vx + vw, vy + vh);
    const rot = Math.round(Math.atan2(qy - py, qx - px) * 180 / Math.PI);
    const pl = {page: p.page, sig: p.sig, x: px, y: py, w: vw, h: vh, rot};
    if (dateText) { const s = Math.max(6, Math.min(9, vh * 0.18)); const [dx, dy] = vp.convertToPdfPoint(vx + 2, vy + vh + s + 2); pl.dx = dx; pl.dy = dy; }
    placements.push(pl); used.add(p.sig); page.cleanup();
  }
  const sigs = {}; SIGS.filter(s => used.has(s.id)).forEach(s => sigs[s.id] = s.bytes.slice());
  const bytes = await engine('sign', {bytes: bytesOfFile(f), sigs, placements, dateText});
  const pagesSigned = new Set(mapped.map(p => p.page)).size;
  return {outputs: [{name: outName(baseName(f.name) + '_assinado', 'pdf'), blob: blobOf(bytes, 'pdf'), preview: f.signPages?.[mapped[0].page] || f.thumb}],
    extra: () => ({subtitle: `${mapped.length} ${mapped.length === 1 ? 'assinatura aplicada' : 'assinaturas aplicadas'} em ${pagesSigned} ${pagesSigned === 1 ? 'página' : 'páginas'}${o.date ? ', com data e hora' : ''}.`})};
}
RUNNERS['assinar-pdf'] = signPdf;

/* ---------------- Boot ---------------- */
applyTheme();
installIcons();
route();
setTimeout(() => { lib('pdfjs').catch(() => {}); Engine.ensure().catch(() => {}); }, 1500);

</script>
</body>
