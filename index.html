  const sc = e.target.closest('[data-scroll]');
  if (sc) { e.preventDefault(); const id = sc.dataset.scroll; const el = document.getElementById(id); if (el) el.scrollIntoView({behavior: 'smooth', block: 'start'}); else go(id); return; }
  const tg = e.target.closest('[data-toggle]');
  if (tg) { const k = tg.dataset.toggle; state.opts[k] = !state.opts[k]; if (k === 'skipFirst') { const f = state.files[0]; if (f) { f.big = null; } renderStage(); return; } refreshOptions(); return; }
  const opt = e.target.closest('[data-opt]');
  if (opt) {
    const k = opt.dataset.opt, raw = opt.dataset.val; const v = /^\d+(\.\d+)?$/.test(raw) ? +raw : raw;
    if (state.opts[k] === v) return;
    state.opts[k] = v;
    if (['mode'].includes(k) && state.tool.id === 'dividir-pdf') renderStage(); else refreshOptions();
    return;
  }
  const pg = e.target.closest('.pg');
  if (pg && !e.target.closest('[data-act]')) {
    if (state.tool?.id === 'dividir-pdf') togglePage(+pg.dataset.page, pg);
    else if (state.tool?.id === 'girar-pdf') rotatePage(+pg.dataset.idx, 90);
    return;
  }
  const st = e.target.closest('[data-set]');
  if (st) { const k = st.dataset.set, raw = st.dataset.val; settings[k] = /^\d+$/.test(raw) ? +raw : raw; saveSettings(); if (k === 'theme') applyTheme(); render(); toast('Preferência salva', 'success', 1600); return; }
  const tgs = e.target.closest('[data-set-toggle]');
  if (tgs) { const k = tgs.dataset.setToggle; settings[k] = !settings[k]; saveSettings(); applyTheme(); tgs.classList.toggle('on', settings[k]); tgs.setAttribute('aria-checked', settings[k]); toast('Preferência salva', 'success', 1600); return; }
  const cp = e.target.closest('[data-copy]');
  if (cp) { try { await navigator.clipboard.writeText(cp.dataset.copy); toast(`${cp.dataset.copy} copiado`, 'success', 1800); } catch (err) { toast(`Código: ${cp.dataset.copy}`, 'info'); } return; }
  const dl = e.target.closest('[data-dl]');
  if (dl) {
    const map = {'logo-light': ['fileflow-logo-claro.svg', SVG_LOGO(false)], 'logo-dark': ['fileflow-logo-escuro.svg', SVG_LOGO(true)], 'logo-short': ['fileflow-logo-reduzido.svg', SVG_LOGO_SHORT(false)], 'appicon': ['fileflow-icone-app.svg', SVG_APPICON()], 'favicon': ['fileflow-favicon.svg', SVG_FAVICON()]};
    const [n, s] = map[dl.dataset.dl]; download(new Blob([s], {type: 'image/svg+xml'}), n); return;
  }
  if (e.target.closest('#dropzone') && !e.target.closest('button')) { openPicker(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const i = +a.dataset.i;
  switch (a.dataset.act) {
    case 'skip': e.preventDefault(); $('#main').focus(); break;
    case 'theme': toggleTheme(); break;
    case 'menu': $('#nav').classList.toggle('open'); break;
    case 'shortcuts': e.preventDefault(); showShortcuts(); break;
    case 'history': openDrawer(); break;
    case 'close-drawer': closeDrawer(); break;
    case 'pick': e.stopPropagation(); openPicker(); break;
    case 'pick-any': openPicker(true); break;
    case 'remove': {
      const f = state.files[i]; try { f.pdf?.destroy(); } catch (err) {} if (f.url) URL.revokeObjectURL(f.url);
      state.files.splice(i, 1); if (!state.files.length) state.phase = 'upload'; if (state.tool.id === 'dividir-pdf') state.opts.selected = new Set(); state.opts.pageList = null;

    }

    case 'down': moveFile(i, i + 1); break;
    case 'preview-in': { const f = state.files[i]; previewFile({name: f.name, file: f.file, blob: f.file, pdf: f.pdf}); break; }
    case 'preview-out': { const o = state.result.outputs[i]; previewFile({name: o.name, blob: o.blob}); break; }

      state.pending = files; go(a.dataset.tool); break;
    }

    case 'sel-all': { const f = state.files[0]; state.opts.selected = new Set(Array.from({length: f.pages}, (_, k) => k + 1)); renderStage(); break; }
    case 'sel-none': state.opts.selected = new Set(); renderStage(); break;
    case 'pg-rot': rotatePage(+a.dataset.idx, 90); break;
    case 'pg-del': deletePage(+a.dataset.idx); break;
    case 'rot-all': state.opts.pageList.forEach(p => p.rot += +a.dataset.deg); renderStage(); break;
    case 'rot-reset': state.opts.pageList.forEach(p => p.rot = 0); renderStage(); break;
    case 'org-reverse': state.opts.pageList.reverse(); renderStage(); break;
    case 'org-reset': state.opts.pageList = null; renderStage(); break;
    case 'pw-show': state.opts.show = !state.opts.show; refreshOptions(); $('#o-pw')?.focus(); break;
    case 'h-dl': { const h = state.history.find(x => x.id === a.dataset.id); h.final.forEach((o, k) => setTimeout(() => download(o.blob, o.name), k * 250)); break; }
    case 'h-preview': { const h = state.history.find(x => x.id === a.dataset.id); const o = h.final[0]; previewFile({name: o.name, blob: o.blob}); break; }
    case 'h-chain': {
      const h = state.history.find(x => x.id === a.dataset.id); const ids = nextActions(h.outputs, h.tool);
      const target = ids.length === 1 ? ids[0] : await modal({title: 'Usar o resultado em…', icon: 'chain', wide: true, actions: [], body: `<div class="pick-grid">${ids.map(id => { const t = toolById(id); return `<button class="pick" data-modal-val="${id}"><span class="tool-ic">${ICONS[t.icon]}</span><span>${esc(t.name)}</span></button>`; }).join('')}</div>`});
      if (target) { closeDrawer(); state.pending = h.outputs.map(o => new File([o.blob], o.name, {type: o.blob.type})); go(target); }
      break;
    }
    case 'h-clear': {
      const ok = await modal({title: 'Limpar o histórico?', icon: 'trash', tone: 'warn', body: '<p>Os resultados desta sessão serão removidos da memória. Arquivos já baixados não são afetados.</p>', actions: [{label: 'Cancelar', value: false}, {label: 'Limpar', danger: true, value: true}]});
      if (ok) { state.history = []; refreshHeader(); if (state.drawer) $('#drawer').innerHTML = drawerHTML(); if (state.route === 'configuracoes') render(); toast('Histórico limpo', 'success'); }
      break;
    }
    case 'reset-settings': {
      const ok = await modal({title:'Restaurar configurações?', icon:'refresh', body:'<p>Todas as preferências voltarão aos valores originais.</p>', actions:[{label:'Cancelar', value:false}, {label:'Restaurar', primary:true, value:true}]});
      if (ok) { settings = {...DEFAULT_SETTINGS}; saveSettings(); applyTheme(); render(); toast('Configurações restauradas', 'success'); } break;
    }
    case 'demo-toast': toast('Conversão concluída com sucesso', 'success'); break;
    case 'demo-modal': modal({title:'Exemplo de modal', icon:'info', body:'<p>Modais seguem a mesma linguagem visual: cantos arredondados, sombra suave e ações claras.</p>', actions:[{label:'Fechar'}, {label:'Confirmar', primary:true}]}); break;
  }
});
function togglePage(n, el) {
  const s = state.opts.selected; s.has(n) ? s.delete(n) : s.add(n);
  el.classList.toggle('on', s.has(n)); el.setAttribute('aria-checked', s.has(n));
  refreshOptions();
  const small = $('#sel-count'); if (small) small.textContent = `${s.size} de ${state.files[0].pages} selecionadas`;
}

/* ---------- Keyboard ---------- */
const typing = el => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);
document.addEventListener('keydown', e => {
  const el = e.target, mod = e.ctrlKey || e.metaKey;
  if (document.querySelector('.overlay')) return; // modais tratam o próprio teclado
  if (e.key === 'Escape') { if (state.drawer) { closeDrawer(); return; } $('#nav')?.classList.remove('open'); return; }
  if (state.drawer && e.key === 'Tab') { trapFocus($('#drawer .drawer'), e); return; }
  if (mod && e.key === 'Enter' && state.phase === 'ready') { e.preventDefault(); if (!validate()) startProcess(); else toast(validate(), 'warn'); return; }
  if (mod && (e.key === 'o' || e.key === 'O')) { e.preventDefault(); openPicker(state.route !== 'tool'); return; }
  if ((e.key === 'Enter' || e.key === ' ') && el.id === 'dropzone') { e.preventDefault(); openPicker(); return; }
  // grade de páginas
  const pg = el.closest?.('.pg');
  if (pg) {
    const all = $$('#pages .pg'), idx = all.indexOf(pg);
    const cols = Math.max(1, Math.round($('#pages').clientWidth / (pg.offsetWidth + 12)));
    const org = state.tool?.id === 'organizar-pdf';
    let nx = null;
    if (e.key === 'ArrowRight') nx = idx + 1; else if (e.key === 'ArrowLeft') nx = idx - 1; else if (e.key === 'ArrowDown') nx = idx + cols; else if (e.key === 'ArrowUp') nx = idx - cols;
    if (nx !== null) {
      e.preventDefault();
      if (org && e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { movePage(idx, nx, true); return; }
      all[Math.max(0, Math.min(all.length - 1, nx))]?.focus(); return;
    }
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (state.tool.id === 'dividir-pdf') togglePage(+pg.dataset.page, pg); else rotatePage(+pg.dataset.idx, 90); return; }
    if ((e.key === 'r' || e.key === 'R') && pg.dataset.idx !== undefined) { e.preventDefault(); rotatePage(+pg.dataset.idx, e.shiftKey ? -90 : 90); return; }
    if ((e.key === 'Delete' || e.key === 'Backspace') && org) { e.preventDefault(); deletePage(+pg.dataset.idx); return; }
  }
  if (typing(el) || mod || e.altKey) return;
  if (e.key === '/') { const s = $('#search'); if (s) { e.preventDefault(); s.focus(); } else { e.preventDefault(); go('inicio'); setTimeout(() => $('#search')?.focus(), 80); } }
  else if (e.key === '?') { e.preventDefault(); showShortcuts(); }
  else if (e.key === 't' || e.key === 'T') toggleTheme();
  else if (e.key === 'h' || e.key === 'H') state.drawer ? closeDrawer() : openDrawer();
});

/* ---------- Inputs ---------- */
let textTimer;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'search') { state.search = el.value; const c = $('#cats'); if (c) c.innerHTML = catsHTML(); return; }
  if (el.dataset.text) {
    const k = el.dataset.text; state.opts[k] = el.type === 'number' ? +el.value : el.value;
    if (k === 'text' || k === 'start') updateOverlayPreview();
    clearTimeout(textTimer); textTimer = setTimeout(() => refreshOptions(true), 220);
    return;
  }
  if (el.dataset.range) {
    state.opts[el.dataset.range] = +el.value;
    el.nextElementSibling.textContent = el.dataset.range === 'size' ? `${el.value} pt` : Math.round(el.value * 100) + '%';
    updateOverlayPreview(); return;
  }
  if (el.dataset.setRange) { settings[el.dataset.setRange] = +el.value; el.nextElementSibling.textContent = Math.round(el.value * 100) + '%'; saveSettings(); return; }
  if (el.dataset.setText !== undefined) { settings[el.dataset.setText] = el.value.replace(/[\\/:*?"<>|]/g, ''); saveSettings(); return; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.setSelect) { settings[el.dataset.setSelect] = +el.value; saveSettings(); toast('Preferência salva', 'success', 1600); }
  if (el.dataset.select) { state.opts[el.dataset.select] = +el.value; refreshOptions(); }
});

/* ---------- Drag & drop / paste em qualquer lugar ---------- */
let dragDepth = 0;
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
function dropMessage() {
  if (state.route === 'tool' && ['upload', 'ready'].includes(state.phase)) return [`Solte para adicionar em “${state.tool.name}”`, `Formatos aceitos: ${acceptLabel(state.tool).join(', ')}`];
  return ['Solte seus arquivos para começar', 'O FileFlow sugere a ferramenta certa para cada tipo de arquivo'];
}
window.addEventListener('dragenter', e => {
  if (!hasFiles(e)) return; e.preventDefault(); dragDepth++;
  const ov = $('#drop-ov'); const [t, s] = dropMessage(); ov.querySelector('b').textContent = t; ov.querySelector('span').textContent = s; ov.classList.add('show');
  $('#dropzone')?.classList.add('drag');
});
window.addEventListener('dragover', e => { e.preventDefault(); });
window.addEventListener('dragleave', e => { if (!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) { $('#drop-ov').classList.remove('show'); $('#dropzone')?.classList.remove('drag'); } });
window.addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; $('#drop-ov').classList.remove('show'); $('#dropzone')?.classList.remove('drag');
  const files = [...(e.dataTransfer?.files || [])]; if (!files.length) return;
  intake(files);
});
function intake(files) {
  if (state.phase === 'processing') { toast('Aguarde o processamento atual terminar.', 'warn'); return; }
  if (state.route === 'tool' && ['upload', 'ready'].includes(state.phase)) {
    const okKinds = files.filter(f => { const k = detectKind(f); return state.tool.accept.includes(k) || (k === 'jpg' && state.tool.accept.includes('jpeg')); });
    if (okKinds.length || files.length === 0) return addFiles(files);
  }
  smartOpen(files);
}
document.addEventListener('paste', e => {
  const files = [...(e.clipboardData?.files || [])];
  if (!files.length) return;
  e.preventDefault();
  const named = files.map((f, k) => f.name && f.name !== 'image.png' ? f : new File([f], `imagem-colada-${Date.now().toString(36)}${k ? '-' + k : ''}.${detectKind(f) === 'jpg' ? 'jpg' : extOf(f.name || 'x.png') || 'png'}`, {type: f.type}));
  toast(`${named.length} ${named.length === 1 ? 'arquivo colado' : 'arquivos colados'}`, 'info', 1800);
  intake(named);
});
window.addEventListener('hashchange', route);
window.addEventListener('beforeunload', e => { if (state.phase === 'processing') { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('resize', () => updateOverlayPreview());

/* ---------------- Boot ---------------- */
applyTheme();
installIcons();
route();
setTimeout(() => { lib('pdfjs').catch(() => {}); Engine.ensure().catch(() => {}); }, 1500);

</script>
</body>
